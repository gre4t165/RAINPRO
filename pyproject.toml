[build-system]
requires = ["setuptools>=69,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "rainpro"
version = "0.1.0"
description = "Rain ASMR Studio desktop foundation"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.7,<7"]

[project.scripts]
rainpro = "rainpro.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
